[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl3d-vtk"
version = "0.5.0"
description = "Scientific 3D plotting with VTK and native Matplotlib axes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.25", "matplotlib>=3.11,<3.12", "vtk>=9.4,<10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/guessable/mpl3dVTK"
Documentation = "https://github.com/guessable/mpl3dVTK/blob/main/docs/plot_catalog.md"
Issues = "https://github.com/guessable/mpl3dVTK/issues"

[tool.setuptools]
packages = ["mpl3d_vtk"]

[tool.setuptools.package-data]
mpl3d_vtk = ["_my_mpl_style_license.txt"]
